name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'settings.gradle'
      - 'app/**'
      - '.github/workflows/omni-float-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify and name the APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify "$APK"
          cp "$APK" Omni_Float_AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Omni-Float-AI-APK
          path: Omni_Float_AI.apk
          if-no-files-found: error

