name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'settings.gradle'
      - 'app/**'
      - '.github/workflows/omni-float-android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify and name the APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify "$APK"
          cp "$APK" Omni_Float_AI.apk
          sha256sum Omni_Float_AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Omni-Float-AI-APK
          path: Omni_Float_AI.apk
          if-no-files-found: error
      - name: Publish signed APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          tag="omni-float-v$version"
          asset="Omni_Float_AI_v$version.apk"
          cp Omni_Float_AI.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "Omni Float AI $version" --notes "APK Android dengan terjemahan layar langsung."
          fi
