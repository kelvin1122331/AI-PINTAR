name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'settings.gradle'
      - 'gradle.properties'
      - 'app/**'
      - 'tools/android-smoke.py'
      - '.github/workflows/omni-float-android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and package Android app and tests
        run: |
          gradle --no-daemon --stacktrace --max-workers=2 :app:assembleDebug
          gradle --no-daemon --stacktrace --max-workers=2 :app:assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -camera-front emulated
          script: |
            adb install -g app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w id.omni.floatai.test/id.omni.floatai.SmokeInstrumentation | tee /tmp/omni-instrumentation.txt
            adb logcat -d -s OmniSmoke:I AndroidRuntime:E
            grep -q OMNI_SMOKE_PASS /tmp/omni-instrumentation.txt
            python3 -u tools/android-smoke.py || (adb logcat -d -s AndroidRuntime:E; exit 1)
      - name: Verify and name the APK
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for ABI in arm64-v8a universal; do
            APK="app/build/outputs/apk/debug/app-$ABI-debug.apk"
            "$SIGNER" verify --print-certs "$APK"
            cp "$APK" "Omni_Float_AI_$ABI.apk"
          done
          sha256sum Omni_Float_AI_*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Omni-Float-AI-APK
          path: Omni_Float_AI_*.apk
          if-no-files-found: error
      - name: Publish signed APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          tag="omni-float-v$version"
          asset="Omni_Float_AI_v$version.apk"
          cp Omni_Float_AI_arm64-v8a.apk "$asset"
          cp Omni_Float_AI_universal.apk "Omni_Float_AI_v$version-universal.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" "$asset" "Omni_Float_AI_v$version-universal.apk" --target "$GITHUB_SHA" --title "Omni Float AI $version" --notes "Terjemahan layar yang stabil, kontrol kamera, kamus pribadi, alat belajar, dan diagnostik API."
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
            curl --fail --location --retry 3 --retry-all-errors --max-time 90 "$URL" --output /tmp/omni-public.apk
            cmp "$asset" /tmp/omni-public.apk
            echo "Public APK download matched the signed build."
          fi
