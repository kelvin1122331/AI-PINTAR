name: Verify delivered Omni Float APK
on:
  push:
    branches: [verify-omni-v13]
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Omni-Float-AI-APK
          run-id: '44940986216'
          github-token: ${{ github.token }}
      - name: Verify exact delivered APK
        run: |
          echo '9cf4e065cbc54f7cc3ac33c84a7baad7dd5c5bf4eaf9822ed47903a18deff599  Omni_Float_AI.apk' | sha256sum -c -
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write Android UI checks
        run: |
          cat > /tmp/verify_omni.py <<'PY'
          import re, subprocess, time
          import xml.etree.ElementTree as ET

          def adb(*args):
              return subprocess.check_output(['adb', *args], text=True, timeout=45).strip()

          def nodes():
              adb('shell', 'uiautomator', 'dump', '/sdcard/verify-omni.xml')
              return list(ET.fromstring(adb('exec-out', 'cat', '/sdcard/verify-omni.xml')).iter('node'))

          def node(label, retries=3):
              for _ in range(retries):
                  for item in nodes():
                      if any((item.get(key) or '').casefold() == label.casefold() for key in ('text','content-desc')):
                          return item
                  time.sleep(.3)
              return None

          def tap_node(item):
              assert item is not None
              x, y, r, b = map(int, re.findall(r'\d+', item.get('bounds', '')))
              adb('shell', 'input', 'tap', str((x+r)//2), str((y+b)//2))
              time.sleep(.5)

          def tap(label):
              item = node(label)
              assert item is not None, f'Missing UI: {label}'
              tap_node(item)

          def require(label):
              assert node(label) is not None, f'Missing UI: {label}'
              print(f'PASS UI {label}', flush=True)

          def scroll():
              size = re.findall(r'(\d+)x(\d+)', adb('shell','wm','size'))[-1]
              w,h = map(int,size)
              adb('shell','input','swipe',str(w//2),str(h*7//10),str(w//2),str(h*4//10),'380')

          package = 'id.omni.floatai'
          print(adb('install', '-g', 'Omni_Float_AI.apk'))
          assert 'versionName=1.4' in adb('shell', 'dumpsys', 'package', package)
          adb('shell', 'appops', 'set', package, 'SYSTEM_ALERT_WINDOW', 'allow')
          adb('shell', 'am', 'start', '-W', '-n', package + '/.MainActivity')
          require('Omni Float AI')
          require('Aktifkan floating')
          require('Platform kuis')
          tap('Masukkan API key')
          require('Pengaturan API')
          require('API key')
          require('Muat ulang model')
          require('Pilih model')
          save = node('Simpan & pakai',1)
          assert save is None or save.get('enabled') == 'false'
          print('PASS empty API key cannot save profile', flush=True)
          tap('Batal')
          tap('Aktifkan floating')
          service = adb('shell','dumpsys','activity','services',package)
          assert 'BubbleService' in service and 'isForeground=true' in service
          print('PASS foreground bubble service', flush=True)
          adb('shell','input','keyevent','KEYCODE_HOME')
          time.sleep(1)
          bubble = node('Buka chat Omni Float AI', 1) or node('AI', 1)
          if bubble is not None:
              tap_node(bubble)
          else:
              density = int(re.findall(r'(\d+)',adb('shell','wm','density'))[-1])/160
              for y in (153, 177, 195):
                  adb('shell','input','tap',str(round(44*density)),str(round(y*density)))
                  if node('Chatbot',1) is not None:
                      break
          require('Chatbot')
          tap('Mode otomatis')
          require('Izinkan akses layar')
          require('Terjemah langsung ke Indonesia')
          all_labels = set()
          for attempt in range(3):
              all_labels.update(n.get('text') for n in nodes())
              if attempt < 2: scroll()
          for name in ['Jawab 1 soal','Otomatis sampai akhir halaman','Otomatis 30 detik','Otomatis 30 menit','Stop generation']:
              assert name in all_labels, ('Missing tool',name, sorted(x for x in all_labels if x))
              print(f'PASS UI {name}', flush=True)
          tap('Stop generation')
          require('Sesi layar berhenti.')
          tap('Samaran')
          time.sleep(.5)
          density = int(re.findall(r'(\d+)',adb('shell','wm','density'))[-1])/160
          for y in (153,177,195):
              adb('shell','input','tap',str(round(44*density)),str(round(y*density)))
              if node('Mode otomatis',1) is not None: break
          require('Mode otomatis')
          print('PASS purple and orange UI smoke flow', flush=True)
          raise SystemExit(0)
          tap('Izinkan akses layar')
          seen = [n.get('text') for n in nodes() if n.get('text')]
          print('CONSENT UI:', seen, flush=True)
          assert any('screen' in v.lower() or 'record' in v.lower() or 'cast' in v.lower() for v in seen), seen
          for label in ('Start now','Share screen','Start recording','Start'):
              target = node(label,1)
              if target is not None:
                  tap_node(target)
                  break
          else:
              raise AssertionError('Android capture consent button was not recognized')
          require('Matikan akses layar')
          tap('Matikan akses layar')
          require('Akses layar dimatikan.')
          adb('shell', 'settings', 'put', 'secure', 'enabled_accessibility_services', package + '/.QuizAccessibility')
          adb('shell', 'settings', 'put', 'secure', 'accessibility_enabled', '1')
          time.sleep(1)
          assert 'QuizAccessibility' in adb('shell','dumpsys','accessibility')
          print('PASS accessibility service binding', flush=True)
          tap('Jawab 1 soal')
          density = int(re.findall(r'(\d+)',adb('shell','wm','density'))[-1])/160
          for y in (153,177,195):
              adb('shell','input','tap',str(round(44*density)),str(round(y*density)))
              if node('Mode otomatis',1) is not None: break
          require('Atur provider dan model di menu API.')
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 -u /tmp/verify_omni.py
