name: Verify Omni Float 2.0 tools
on:
  push:
    branches: [verify-omni-v13]
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 87bcec99c7d595e95eda79af05ecde378b8574a8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Omni_Float_AI.apk
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write Android UI checks
        run: |
          cat > /tmp/verify_omni.py <<'PY'
          import re, subprocess, time
          import xml.etree.ElementTree as ET

          def adb(*args):
              return subprocess.check_output(['adb', *args], text=True, timeout=45).strip()

          def nodes():
              adb('shell', 'uiautomator', 'dump', '/sdcard/verify-omni.xml')
              return list(ET.fromstring(adb('exec-out', 'cat', '/sdcard/verify-omni.xml')).iter('node'))

          def node(label, retries=3):
              for _ in range(retries):
                  for item in nodes():
                      if any((item.get(key) or '').casefold() == label.casefold() for key in ('text','content-desc')):
                          return item
                  time.sleep(.3)
              return None

          def tap_node(item):
              assert item is not None
              x, y, r, b = map(int, re.findall(r'\d+', item.get('bounds', '')))
              adb('shell', 'input', 'tap', str((x+r)//2), str((y+b)//2))
              time.sleep(.5)

          def tap(label):
              item = node(label)
              assert item is not None, f'Missing UI: {label}'
              tap_node(item)

          def require(label):
              assert node(label) is not None, f'Missing UI: {label}'
              print(f'PASS UI {label}', flush=True)

          def scroll():
              size = re.findall(r'(\d+)x(\d+)', adb('shell','wm','size'))[-1]
              w,h = map(int,size)
              adb('shell','input','swipe',str(w//2),str(h*7//10),str(w//2),str(h*4//10),'380')

          package = 'id.omni.floatai'
          print(adb('install', '-g', 'Omni_Float_AI.apk'))
          assert 'versionName=2.0' in adb('shell', 'dumpsys', 'package', package)
          adb('shell', 'appops', 'set', package, 'SYSTEM_ALERT_WINDOW', 'allow')
          adb('shell', 'am', 'start', '-W', '-n', package + '/.MainActivity')
          require('Omni Float AI')
          require('Aktifkan floating')
          def reveal(label):
              for _ in range(5):
                  item = node(label,1)
                  if item is not None: return item
                  scroll()
              raise AssertionError('Missing UI: ' + label)

          tap_node(reveal('Belajar'))
          require('AI Study Mode')
          require('Jenis bantuan')
          require('Panjang respons')
          tap('Buat')
          require('Isi materi terlebih dulu.')
          tap('Koneksi')
          require('AI Connection Monitor')
          tap('Tes koneksi AI')
          require('Atur model dan API key terlebih dulu.')
          tap('Bubble')
          require('Smart Floating Bubble')
          tap('Tempel otomatis ke tepi')
          adb('shell','input','keyevent','KEYCODE_BACK')
          tap_node(reveal('Kamera'))
          require('Terjemah Kamera')
          require('Jeda')
          require('Senter')
          require('Salin')
          tap('Jeda')
          require('Lanjut')
          tap('Senter')
          tap('Salin')
          require('Terjemah Kamera')
          print('PASS camera controls, Study, monitor, and bubble settings', flush=True)
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 -u /tmp/verify_omni.py
