name: Verify delivered Omni Float APK
on:
  push:
    branches: [verify-omni-v13]
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Omni-Float-AI-APK
          run-id: '44943479966'
          github-token: ${{ github.token }}
      - name: Verify exact delivered APK
        run: |
          echo '38666f84174194f79e6e18f41ae7bcbcfabc68996aab6d1ef0ffc9c06f3b40c3  Omni_Float_AI.apk' | sha256sum -c -
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build a scrollable English test screen
        run: |
          mkdir -p /tmp/omnifixture/classes /tmp/omnifixture/dex
          cd /tmp/omnifixture
          cat > AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="id.omni.fixture">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35"/>
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".Fixture" android:exported="true"/>
            </application>
          </manifest>
          XML
          cat > Fixture.java <<'JAVA'
          package id.omni.fixture;
          public class Fixture extends android.app.Activity {
              public void onCreate(android.os.Bundle state) {
                  super.onCreate(state);
                  var scroll = new android.widget.ScrollView(this);
                  var list = new android.widget.LinearLayout(this);
                  list.setOrientation(1);
                  list.setPadding(32, 90, 32, 80);
                  for (int index = 1; index <= 30; index++) {
                      var text = new android.widget.TextView(this);
                      text.setText(index + ". " + (index % 2 == 0 ? "Thank you for reading this message." : "Good morning, how are you today?"));
                      text.setTextColor(0xff111111);
                      text.setTextSize(22);
                      text.setPadding(0, 22, 0, 110);
                      list.addView(text);
                  }
                  scroll.addView(list);
                  setContentView(scroll);
              }
          }
          JAVA
          jars="$ANDROID_HOME/platforms/android-35/android.jar"
          build=$(dirname "$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)")
          javac --release 17 -cp "$jars" -d classes Fixture.java
          "$build/d8" --min-api 26 --lib "$jars" --output dex classes/id/omni/fixture/Fixture.class
          "$build/aapt2" link --manifest AndroidManifest.xml -I "$jars" -o fixture-unsigned.apk
          zip -j fixture-unsigned.apk dex/classes.dex
          keytool -genkeypair -noprompt -keystore fixture.jks -storepass android -alias fixture -keypass android -keyalg RSA -validity 2 -dname CN=Fixture
          "$build/apksigner" sign --ks fixture.jks --ks-pass pass:android --out /tmp/omni-fixture.apk fixture-unsigned.apk
      - name: Write Android UI checks
        run: |
          cat > /tmp/verify_omni.py <<'PY'
          import re, subprocess, time
          import xml.etree.ElementTree as ET

          def adb(*args):
              return subprocess.check_output(['adb', *args], text=True, timeout=45).strip()

          def nodes():
              adb('shell', 'uiautomator', 'dump', '/sdcard/verify-omni.xml')
              return list(ET.fromstring(adb('exec-out', 'cat', '/sdcard/verify-omni.xml')).iter('node'))

          def node(label, retries=3):
              for _ in range(retries):
                  for item in nodes():
                      if any((item.get(key) or '').casefold() == label.casefold() for key in ('text','content-desc')):
                          return item
                  time.sleep(.3)
              return None

          def tap_node(item):
              assert item is not None
              x, y, r, b = map(int, re.findall(r'\d+', item.get('bounds', '')))
              adb('shell', 'input', 'tap', str((x+r)//2), str((y+b)//2))
              time.sleep(.5)

          def tap(label):
              item = node(label)
              assert item is not None, f'Missing UI: {label}'
              tap_node(item)

          def require(label):
              assert node(label) is not None, f'Missing UI: {label}'
              print(f'PASS UI {label}', flush=True)

          def scroll():
              size = re.findall(r'(\d+)x(\d+)', adb('shell','wm','size'))[-1]
              w,h = map(int,size)
              adb('shell','input','swipe',str(w//2),str(h*7//10),str(w//2),str(h*4//10),'380')

          package = 'id.omni.floatai'
          print(adb('install', '-g', 'Omni_Float_AI.apk'))
          assert 'versionName=1.5.1' in adb('shell', 'dumpsys', 'package', package)
          adb('shell', 'appops', 'set', package, 'SYSTEM_ALERT_WINDOW', 'allow')
          adb('shell', 'am', 'start', '-W', '-n', package + '/.MainActivity')
          require('Omni Float AI')
          require('Aktifkan floating')
          require('Platform kuis')
          tap('Masukkan API key')
          require('Pengaturan API')
          require('API key')
          require('Muat ulang model')
          require('Pilih model')
          save = node('Simpan & pakai',1)
          assert save is None or save.get('enabled') == 'false'
          print('PASS empty API key cannot save profile', flush=True)
          tap('Batal')
          tap('Aktifkan floating')
          service = adb('shell','dumpsys','activity','services',package)
          assert 'BubbleService' in service and 'isForeground=true' in service
          print('PASS foreground bubble service', flush=True)
          adb('install', '/tmp/omni-fixture.apk')
          adb('shell','am','start','-W','-n','id.omni.fixture/.Fixture')
          time.sleep(1)

          def open_bubble():
              bubble = node('Buka chat Omni Float AI',1) or node('AI',1)
              if bubble is not None:
                  tap_node(bubble)
              else:
                  density = int(re.findall(r'(\d+)',adb('shell','wm','density'))[-1])/160
                  for y in (153,177,195):
                      adb('shell','input','tap',str(round(44*density)),str(round(y*density)))
                      if node('Mode otomatis',1) is not None: break
              require('Mode otomatis')

          def window_counts():
              dump = adb('shell', 'dumpsys', 'window', 'windows')
              return len([l for l in dump.splitlines() if 'Window #' in l and 'Omni Float Translation' in l])

          open_bubble()
          tap('Mode otomatis')
          tap('Aktifkan Terjemah Layar')
          require('Start')
          tap('Start')
          time.sleep(2)
          until = time.monotonic() + 95
          while time.monotonic() < until:
              if window_counts() >= 1: break
              time.sleep(1)
          else:
              open_bubble()
              print('Overlay UI:', [n.get('text') for n in nodes() if n.get('text')], flush=True)
              raise AssertionError('Translation window was not drawn.')
          print('PASS real screen capture creates translation overlay', flush=True)
          before = [n.get('text') for n in nodes() if 'for reading' in (n.get('text') or '') or 'Good morning' in (n.get('text') or '')]
          assert before, 'English fixture did not regain focus after screen permission'
          print('PASS source app stays visible after consent', flush=True)
          scroll()
          time.sleep(2)
          after = [n.get('text') for n in nodes() if 'for reading' in (n.get('text') or '') or 'Good morning' in (n.get('text') or '')]
          assert before != after, 'Underlying page did not scroll'
          until = time.monotonic() + 20
          while time.monotonic() < until:
              if window_counts() >= 1: break
              time.sleep(1)
          else:
              raise AssertionError('Translation overlay did not return after scroll')
          print('PASS page scroll works with translation overlay', flush=True)
          open_bubble()
          tap('Nonaktifkan Terjemah Layar')
          require('Terjemah nonaktif.')
          require('Aktifkan Terjemah Layar')
          assert window_counts() == 0, 'Translation window remains after toggle off'
          print('PASS translation toggles off with the same control', flush=True)
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 -u /tmp/verify_omni.py
